<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research | Buildwell Plus prototype</title>
<link rel="stylesheet" href="../design-system/buildwell.css">
<link rel="stylesheet" href="../design-system/lofi.css">
<style>
  body{padding:28px 24px 60px}
  h1.bw-h1{margin-bottom:32px}
  .masonry{columns:3 320px;column-gap:16px}
  .slot{break-inside:avoid;margin-bottom:16px;border-radius:10px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .slot img{width:100%;display:block}
</style>
</head>
<body>
<div style="max-width:1400px;margin:0 auto">
  <h1 class="bw-h1">Competitor Research</h1>
  <div class="masonry" id="g-all"></div>
</div>

<script>
// fill each grid from assets/research/<dir>/ — listed files only, no captions
var FILES = [
  ['email','Screenshot 2026-10-20 at 12.31.24\u202fpm.png'],
  ['email','Deel Web 51.png'],
  ['email','Screenshot 2026-10-20 at 12.59.05\u202fpm.png']
];
var el = document.getElementById('g-all');
FILES.forEach(function(pair){
  var slot=document.createElement('div'); slot.className='slot';
  var img=new Image();
  img.src='../assets/research/'+pair[0]+'/'+pair[1];
  img.onerror=function(){ slot.remove(); };
  slot.appendChild(img);
  el.appendChild(slot);
});
</script>
<script src="../design-system/buildwell.js"></script>
</body>
</html>
